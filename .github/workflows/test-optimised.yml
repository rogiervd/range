name: Unit tests (release build)
on:
  push:
    branches: [main, develop, test-github-actions]
  pull_request:
    branches: [main, develop, test-github-actions]
  workflow_dispatch:
jobs:
  test-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # A selection of operating system and compiler combinations.
        include:
          - os: ubuntu-26.04
            compiler: gcc
          - os: ubuntu-26.04
            compiler: clang
          - os: macos-26
            compiler: clang
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true
      - run: bazel test --keep_going -c opt --config=${{ matrix.compiler }} //test/...
      - run: bazel run --color=yes //bench/... -c opt
    # To make the benchmark slightly more reliable especially on a VM,
    # consider getting mean/median/variance and doing random reordering:
    # -- --benchmark_min_time=0.1s  --benchmark_repetitions=10 --benchmark_report_aggregates_only=true --benchmark_enable_random_interleaving=true
